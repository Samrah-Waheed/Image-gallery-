<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery | CodeAlpha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        /* Category Buttons */
        .categories {
            text-align: center;
            margin-bottom: 30px;
        }

        .cat-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 10px 25px;
            margin: 5px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .cat-btn:hover, .cat-btn.active {
            background: white;
            color: #667eea;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            background: white;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .overlay {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 15px;
            transition: bottom 0.3s;
        }

        .gallery-item:hover .overlay {
            bottom: 0;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 70%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 45px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover {
            color: #ff6b6b;
        }

        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 15px 22px;
            cursor: pointer;
            font-size: 28px;
            border-radius: 50%;
            transition: 0.3s;
            user-select: none;
        }

        .prev:hover, .next:hover {
            background: rgba(255,255,255,0.5);
        }

        .prev { left: 30px; }
        .next { right: 30px; }

        .caption {
            margin-top: 20px;
            color: white;
            text-align: center;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .prev, .next {
                padding: 8px 14px;
                font-size: 20px;
            }
            .close {
                font-size: 35px;
                top: 15px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📷 Image Gallery</h1>
    <p class="subtitle">Hover on image | Click to enlarge</p>

    <div class="categories">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="nature">🌿 Nature</button>
        <button class="cat-btn" data-cat="city">🌆 City</button>
        <button class="cat-btn" data-cat="tech">💻 Tech</button>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <span class="next">&#10095;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="caption" id="caption"></div>
</div>

<script>
    const images = [
        { src: "https://picsum.photos/id/104/400/300", title: "Beautiful Nature", category: "nature" },
        { src: "https://picsum.photos/id/15/400/300", title: "Forest Path", category: "nature" },
        { src: "https://picsum.photos/id/96/400/300", title: "Mountain View", category: "nature" },
        { src: "https://picsum.photos/id/21/400/300", title: "City Skyline", category: "city" },
        { src: "https://picsum.photos/id/91/400/300", title: "Night Lights", category: "city" },
        { src: "https://picsum.photos/id/22/400/300", title: "Urban Street", category: "city" },
        { src: "https://picsum.photos/id/0/400/300", title: "Laptop Setup", category: "tech" },
        { src: "https://picsum.photos/id/1/400/300", title: "Computer Desk", category: "tech" },
        { src: "https://picsum.photos/id/2/400/300", title: "Workspace", category: "tech" }
    ];

    let currentImages = [...images];
    let currentIndex = 0;

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = currentImages.map((img, idx) => `
            <div class="gallery-item" data-index="${idx}">
                <img src="${img.src}" alt="${img.title}">
                <div class="overlay">
                    <h3>${img.title}</h3>
                    <p>${img.category.toUpperCase()}</p>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const index = parseInt(item.dataset.index);
                openLightbox(index);
            });
        });
    }

    function openLightbox(index) {
        currentIndex = index;
        const img = currentImages[currentIndex];
        document.getElementById('lightbox-img').src = img.src;
        document.getElementById('caption').innerText = img.title;
        document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
    }

    function changeImage(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = currentImages.length - 1;
        if (currentIndex >= currentImages.length) currentIndex = 0;
        const img = currentImages[currentIndex];
        document.getElementById('lightbox-img').src = img.src;
        document.getElementById('caption').innerText = img.title;
    }

    // Category filter
    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const category = btn.dataset.cat;
            if (category === 'all') {
                currentImages = [...images];
            } else {
                currentImages = images.filter(img => img.category === category);
            }
            renderGallery();
        });
    });

    // Lightbox controls
    document.querySelector('.close').addEventListener('click', closeLightbox);
    document.querySelector('.prev').addEventListener('click', () => changeImage(-1));
    document.querySelector('.next').addEventListener('click', () => changeImage(1));

    document.getElementById('lightbox').addEventListener('click', (e) => {
        if (e.target === document.getElementById('lightbox')) closeLightbox();
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
        const lightbox = document.getElementById('lightbox');
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') changeImage(-1);
        if (e.key === 'ArrowRight') changeImage(1);
    });

    renderGallery();
</script>

</body>
</html>
